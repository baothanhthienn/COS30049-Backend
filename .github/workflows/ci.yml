name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secrets-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-raw-sql:
    name: Assert no raw SQL f-strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for raw SQL f-strings
        run: |
          if grep -rE "f['\"].*(SELECT|INSERT|UPDATE|DELETE)" api/ src/ 2>/dev/null; then
            echo "ERROR: raw SQL f-string found — use ORM or text() with bound params"
            exit 1
          fi
          echo "OK: no raw SQL f-strings detected"

  test-backend:
    name: pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_db
          API_KEY: ""
        run: python -m pytest tests/test_api.py tests/test_security.py -q

  axe-a11y:
    name: axe-core accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend directory exists
        id: check_frontend
        run: |
          if [ -d "frontend" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/ directory — axe-core gate skipped (backend-only repo)."
          fi
      - name: Set up Node
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cos30049-backend-production.up.railway.app' }}
      - name: Install axe-core CLI and run audit
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm install -g @axe-core/cli
          npx serve -s dist -l 4173 &
          sleep 3
          axe http://localhost:4173 --exit
